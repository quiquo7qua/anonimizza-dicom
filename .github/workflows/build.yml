name: build
on:
  push:
    branches: ['**']
    tags: ['v*']  # un tag vX.Y.Z pubblica anche la release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python test_anon.py
      - run: python -c "from pathlib import Path; import test_anon as t; t.make_source(Path('esempio'))"
      - name: Versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os, re
          version = os.environ["TAG"][1:]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"tag non valido: {version}"
          open("version.py", "w").write(f"VERSION = {version!r}\n")
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --disable-windowed-traceback --name "Anonimizza DICOM" app.py
          # app senza console: Start-Process -Wait per avere il codice di uscita
          $p = Start-Process -FilePath "dist/Anonimizza DICOM.exe" -ArgumentList "--selftest","esempio" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoverifica fallita: $($p.ExitCode)" }
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --osx-bundle-identifier local.anonimizza-dicom --name "Anonimizza DICOM" app.py
          plutil -replace CFBundleDevelopmentRegion -string it "dist/Anonimizza DICOM.app/Contents/Info.plist"
          plutil -replace CFBundleLocalizations -json '["it"]' "dist/Anonimizza DICOM.app/Contents/Info.plist"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" "dist/Anonimizza DICOM.app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "${GITHUB_REF_NAME#v}" "dist/Anonimizza DICOM.app/Contents/Info.plist"
          fi
          codesign --force --deep -s - "dist/Anonimizza DICOM.app"
          "dist/Anonimizza DICOM.app/Contents/MacOS/Anonimizza DICOM" --selftest esempio
          cd dist && ditto -c -k --keepParent "Anonimizza DICOM.app" "Anonimizza DICOM-mac.zip" && rm -rf "Anonimizza DICOM.app" "Anonimizza DICOM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: anonimizza-dicom-${{ runner.os }}
          path: dist/
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: anonimizza-dicom-Windows
          path: win
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: anonimizza-dicom-macOS
          path: mac
      - name: Release
        run: |
          mkdir out
          cp "win/Anonimizza DICOM.exe" out/Anonimizza-DICOM-Windows.exe
          cp "mac/Anonimizza DICOM-mac.zip" out/Anonimizza-DICOM-Mac.zip
          cd out
          sha256sum Anonimizza-DICOM-Windows.exe Anonimizza-DICOM-Mac.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" Anonimizza-DICOM-Windows.exe Anonimizza-DICOM-Mac.zip SHA256SUMS.txt \
            --title "Anonimizza DICOM $GITHUB_REF_NAME" \
            --notes "Versione ${GITHUB_REF_NAME#v}. Le installazioni esistenti propongono l'aggiornamento all'avvio."
